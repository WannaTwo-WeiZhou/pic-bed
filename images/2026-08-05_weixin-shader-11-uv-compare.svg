  <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
   <defs>
    <linearGradient x1="0" x2="1" y1="0" y2="1">
     <stop stop-color="#fff5df">
     </stop>
     <stop offset="1" stop-color="#edd8ad">
     </stop>
    </linearGradient>
    <pattern width="52" height="52" patternUnits="userSpaceOnUse">
     <path d="M52 0H0V52" fill="none" stroke="#a97842" stroke-width="2" opacity=".55">
     </path>
    </pattern>
    <marker markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
     <path d="M0 0 12 6 0 12Z" fill="#be512e">
     </path>
    </marker>
   </defs>
   <rect width="1200" height="600" rx="36" fill="url(#bg2)">
   </rect>
   <text x="60" y="72" fill="#35271f" font-size="34" font-family="Microsoft YaHei, sans-serif" font-weight="700">
    
    
    
    Shader 放大镜：不是把图拉大，而是把 UV 拉近
   </text>
   <text x="60" y="110" fill="#765d49" font-size="18" font-family="Microsoft YaHei, sans-serif">
    
    
    
    镜片里的采样点向圆心靠拢，小区域就被铺成了大画面
   </text>
   <g transform="translate(80 160)">
    <rect width="390" height="330" rx="22" fill="url(#grid)" stroke="#6f4c31" stroke-width="4">
    </rect>
    <circle cx="195" cy="165" r="106" fill="#dba765" opacity=".25" stroke="#9a682e" stroke-width="7">
    </circle>
    <circle cx="195" cy="165" r="10" fill="#be512e">
    </circle>
    <circle cx="111" cy="85" r="8" fill="#315b5e">
    </circle>
    <circle cx="279" cy="85" r="8" fill="#315b5e">
    </circle>
    <circle cx="111" cy="245" r="8" fill="#315b5e">
    </circle>
    <circle cx="279" cy="245" r="8" fill="#315b5e">
    </circle>
    <text x="195" y="370" text-anchor="middle" fill="#35271f" font-size="24" font-family="Microsoft YaHei, sans-serif" font-weight="700">
     
     
     
     原始 UV：采样范围较大
    </text>
   </g>
   <path d="M505 325H678" stroke="#be512e" stroke-width="7" marker-end="url(#arrow2)">
   </path>
   <text x="591" y="296" text-anchor="middle" fill="#8d3d28" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="700">
    
    
    
    ÷ zoom
   </text>
   <g transform="translate(730 160)">
    <rect width="390" height="330" rx="22" fill="url(#grid)" stroke="#6f4c31" stroke-width="4">
    </rect>
    <circle cx="195" cy="165" r="106" fill="#dba765" opacity=".25" stroke="#d0952e" stroke-width="9">
    </circle>
    <circle cx="195" cy="165" r="10" fill="#be512e">
    </circle>
    <circle cx="153" cy="125" r="8" fill="#315b5e">
    </circle>
    <circle cx="237" cy="125" r="8" fill="#315b5e">
    </circle>
    <circle cx="153" cy="205" r="8" fill="#315b5e">
    </circle>
    <circle cx="237" cy="205" r="8" fill="#315b5e">
    </circle>
    <path d="M111 85 153 125M279 85 237 125M111 245 153 205M279 245 237 205" stroke="#be512e" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow2)">
    </path>
    <text x="195" y="370" text-anchor="middle" fill="#35271f" font-size="24" font-family="Microsoft YaHei, sans-serif" font-weight="700">
     
     
     
     放大 UV：采样点靠近圆心
    </text>
   </g>
   <rect x="225" y="540" width="750" height="42" rx="21" fill="#3a2b22">
   </rect>
   <text x="600" y="568" text-anchor="middle" fill="#fff1d2" font-size="20" font-family="Microsoft YaHei, sans-serif">
    
    
    
    center + (uv - center) / zoom
   </text>
  </svg>
